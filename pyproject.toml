[project]
name = "egm-getting-started"
version = "0.1.0"
description = "Google's Elephant-Goldfish Model, run end to end on a small codebase: brief, design, Goldfish reviews, resolution, implementation."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "Gopal Saini" }]
dependencies = []

[project.scripts]
taskbox = "taskbox.server:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taskbox"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
